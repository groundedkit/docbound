server {
    listen 80;
    root /usr/share/nginx/html;

    # Matches the backend's upload limit (spring.servlet.multipart.max-file-size).
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Chat answers are server-sent events: pass each token through as soon as it arrives.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # Built assets have content hashes in their names, so they can be cached for good. index.html must not be
    # cached, or browsers keep loading the old app after an update.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
